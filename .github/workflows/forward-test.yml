name: MES Forward Test

on:
  schedule:
    - cron: '17 22 * * 5'  # Fridays 22:17 UTC = 6:17 PM New York (5:17 PM after clocks fall back); off the busy top of the hour
    - cron: '17 14 * * 6'  # Backup: Saturdays 14:17 UTC = 10:17 AM New York, in case GitHub skips the Friday run
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write           # needed to save the data files and results back to the repo

concurrency:
  group: forward-test       # never run two copies at the same time
  cancel-in-progress: false

jobs:
  forward-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run forward tests
        run: |
          mkdir -p results
          OUT="results/forward_$(TZ=America/New_York date +%F).md"
          {
            echo "# MES forward test - $(TZ=America/New_York date '+%F %-I:%M %p') ET"
            echo
            echo "## Heikin Ashi pullback (watch row 0: R:R 1, start 09:30)"
            echo '```'
            node mes_backtest.mjs 1m since 2026-10-09
            echo '```'
            echo
            echo "## Opening Range Breakout (watch row 4: R:R 2, 15-min range)"
            echo '```'
            node mes_backtest.mjs orb 1m since 2026-10-09
            echo '```'
            echo
            echo "## Supply & demand zones - MNQ (watch row 1: R:R 2, 30-min chart) - started 2026-10-12"
            echo '```'
            node mes_backtest.mjs mnq sd since 2026-10-12
            echo '```'
            echo
            echo "## 3AM-range liquidity sweep - MES (watch row 4: sweep, R:R 1.5) - started 2026-10-12"
            echo '```'
            node mes_backtest.mjs ldn since 2026-10-12
            echo '```'
            echo
            echo "## Previous-day high/low retest - MES (watch row 3: no trend filter, R:R 2) - started 2026-10-12"
            echo '```'
            node mes_backtest.mjs pdh since 2026-10-12
            echo '```'
            echo
            echo "## Previous-day high/low retest - MNQ (watch row 3: no trend filter, R:R 2) - started 2026-10-12"
            echo '```'
            node mes_backtest.mjs mnq pdh since 2026-10-12
            echo '```'
            echo
            echo "## First-candle FVG, day entry - MNQ (watch row 2: 15-min range, 5-min gap, limit, R:R 2) - started 2026-10-12"
            echo '```'
            node mes_backtest.mjs mnq fvgo since 2026-10-12
            echo '```'
            echo
            echo "## Previous 1-hour candle continuation - MNQ, 1-min (watch row 0: his rules, 2R + break-even at 1.5R) - started 2026-10-12"
            echo '```'
            node mes_backtest.mjs mnq 1m hr1 since 2026-10-12
            echo '```'
            echo
            echo "# Confirmation tracks (same locked versions, other market)"
            echo
            echo "## ORB on MNQ (watch row 4: R:R 2, 15-min range)"
            echo '```'
            node mes_backtest.mjs mnq orb 1m since 2026-10-09
            echo '```'
            echo
            echo "## Supply & demand on MES (watch row 1: R:R 2, 30-min chart)"
            echo '```'
            node mes_backtest.mjs sd since 2026-10-12
            echo '```'
            echo
            echo "## 3AM-range sweep on MNQ (watch row 4: sweep, R:R 1.5)"
            echo '```'
            node mes_backtest.mjs mnq ldn since 2026-10-12
            echo '```'
            echo
            echo "## First-candle FVG day entry on MES (watch row 2: R:R 2)"
            echo '```'
            node mes_backtest.mjs fvgo since 2026-10-12
            echo '```'
            echo
            echo "## Previous 1-hour candle continuation on MES, 1-min (watch row 0: his rules)"
            echo '```'
            node mes_backtest.mjs 1m hr1 since 2026-10-12
            echo '```'
            echo
            echo "# Filter tracks (locked 2026-10-10, started 2026-10-12) - compare the watched filter row to the 'none' row"
            echo
            echo "## ORB + 200 EMA trend + skip choppy - MES, 1-min (watch filter: ema+chop)"
            echo '```'
            node mes_backtest.mjs orb 1m filt since 2026-10-12
            echo '```'
            echo
            echo "## ORB + 200 EMA trend + skip choppy - MNQ, 1-min (watch filter: ema+chop)"
            echo '```'
            node mes_backtest.mjs mnq orb 1m filt since 2026-10-12
            echo '```'
            echo
            echo "## 3AM-range sweep + VWAP side - MES (watch filter: vwap)"
            echo '```'
            node mes_backtest.mjs ldn filt since 2026-10-12
            echo '```'
            echo
            echo "## 3AM-range sweep + VWAP side - MNQ (watch filter: vwap)"
            echo '```'
            node mes_backtest.mjs mnq ldn filt since 2026-10-12
            echo '```'
            echo
            echo "## Previous 1-hour candle + 200 EMA trend - MNQ, 1-min (watch filter: ema)"
            echo '```'
            node mes_backtest.mjs mnq 1m hr1 filt since 2026-10-12
            echo '```'
            echo
            echo "## Previous 1-hour candle + 200 EMA trend - MES, 1-min (watch filter: ema)"
            echo '```'
            node mes_backtest.mjs 1m hr1 filt since 2026-10-12
            echo '```'
            echo
            echo "# \$100 ETF tracks - fractional shares, \$0 commission (locked 2026-10-23, started 2026-10-26). Net \$ on a \$100 account = % return"
            echo
            echo "## 3AM-range sweep - QQQ (watch row 4: sweep, R:R 1.5)"
            echo '```'
            node mes_backtest.mjs qqq ldn since 2026-10-26
            echo '```'
            echo
            echo "## 3AM-range sweep - SPY (watch row 4: sweep, R:R 1.5)"
            echo '```'
            node mes_backtest.mjs spy ldn since 2026-10-26
            echo '```'
            echo
            echo "## 3AM-range sweep + VWAP side - QQQ (watch filter: vwap)"
            echo '```'
            node mes_backtest.mjs qqq ldn filt since 2026-10-26
            echo '```'
            echo
            echo "## 3AM-range sweep + VWAP side - SPY (watch filter: vwap)"
            echo '```'
            node mes_backtest.mjs spy ldn filt since 2026-10-26
            echo '```'
            echo
            echo "## ORB 15-min, 2R + trend & skip choppy - SPY, 5-min (watch filter: ema+chop)"
            echo '```'
            node mes_backtest.mjs spy orb filt since 2026-10-26
            echo '```'
            echo
            echo "## ORB 15-min, 2R + trend & skip choppy - QQQ, 5-min (watch filter: ema+chop)"
            echo '```'
            node mes_backtest.mjs qqq orb filt since 2026-10-26
            echo '```'
            echo
            echo "# Exit tracks (locked 2026-10-10, started 2026-10-12) - compare the watched exit row to the 'fixed' row"
            echo
            echo "## First-candle FVG day entry + trailing stop - MNQ (watch exit: trail)"
            echo '```'
            node mes_backtest.mjs mnq fvgo exits since 2026-10-12
            echo '```'
            echo
            echo "## First-candle FVG day entry + trailing stop - MES (watch exit: trail)"
            echo '```'
            node mes_backtest.mjs fvgo exits since 2026-10-12
            echo '```'
            echo
            echo "_Pass rules (set in advance): 30+ trades, profit factor above 1.3, positive on BOTH markets._"
          } > "$OUT" 2>&1
          node mes_backtest.mjs orb > /dev/null 2>&1 || true   # keep the 5-minute data file growing too
          # Bank MNQ (micro Nasdaq) data too, so it's available for future tests (not reported yet)
          node mes_backtest.mjs mnq orb 1m > /dev/null 2>&1 || true
          node mes_backtest.mjs mnq orb > /dev/null 2>&1 || true
          cp "$OUT" results/LATEST.md
          cat "$OUT" >> "$GITHUB_STEP_SUMMARY"

      - name: Save data and results to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bars_*.json results/
          git commit -m "Forward test $(date +%F)" || echo "Nothing new to commit"
          git pull --rebase -X theirs origin main || true   # pick up any changes pushed since checkout
          git push
